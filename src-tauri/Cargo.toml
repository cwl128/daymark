[package]
name = "daymark"
version = "0.1.1"
description = "Free offline calendar and todo desktop app"
authors = ["Daymark contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "daymark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = "=0.3.1"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSEvent", "block2"] }
block2 = "=0.6.2"

[target.'cfg(target_os = "windows")'.dependencies]
notify-rust = "4.18"
windows = { version = "0.61", features = ["UI_Notifications", "Foundation", "System", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
